version: '3.8'

services:
  kaipoke-api:
    build: .
    container_name: kaipoke-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # データ永続化（セッション情報、CSV等）
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./state.json:/app/state.json
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

